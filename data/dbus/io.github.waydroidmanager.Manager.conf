<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- waydroid-manager daemon. Every method checks the caller's uid itself
     (instances are owned by the user who created them). -->
<busconfig>
    <policy user="root">
        <allow own="io.github.waydroidmanager.Manager"/>
    </policy>
    <policy context="default">
        <allow send_destination="io.github.waydroidmanager.Manager"/>
        <allow receive_sender="io.github.waydroidmanager.Manager"/>
    </policy>
</busconfig>
