# waydroid-manager daemon configuration (restart the daemon after changes:
# sudo systemctl restart waydroid-manager)
[network]
# Shared bridge for all waydroid-manager instances (stock Waydroid uses waydroid0)
bridge = wdm0
# Must not overlap any network you use; instance N gets .(10+N)
subnet = 192.168.241.0/24
# Prevent instances from reaching each other
isolate_instances = true
# Use an nftables table ("waydroid_manager") instead of iptables rules
use_nft = false
